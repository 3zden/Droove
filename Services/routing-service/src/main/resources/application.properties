spring.application.name=routing-service
server.port=8107

# The GraphHopper engine. Not running yet? That is fine - every route falls back to
# a straight-line estimate flagged source=FALLBACK, so this service is usable today
# and gets more accurate the day the engine comes up.
routing.graphhopper.base-url=${GRAPHHOPPER_URL:http://localhost:8989}
routing.graphhopper.profile=car

# A hung dependency must not become our outage: without a read timeout the request
# threads block until the pool is empty and this service dies of someone else's fault.
routing.graphhopper.connect-timeout-ms=500
routing.graphhopper.read-timeout-ms=2000
